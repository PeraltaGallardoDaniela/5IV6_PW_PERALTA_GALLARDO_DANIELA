<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicios con Node</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header>
        <h1>Ejercicios con Node</h1>
    </header>
    <main>
        <!-- Sección 1: Manejo de Arreglos -->
        <section class="ejercicio">
            <h2 id="titulo-arreglos">Arreglos del código <code>01-arreglos.js</code></h2>
            <p>Datos de prueba con JS</p>
            
            <div class="tabla-scroll">
                <table id="tabla-talleres">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Instructor</th>
                            <th>Cupo</th>
                            <th>Inscritos</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Se llena dinámicamente desde JavaScript -->
                    </tbody>
                </table>
            </div>

            <form id="form-arreglos" class="formulario">
                <div class="campos">
                    <label for="operacion-arreglo">Operación</label>
                    <select name="operacion-arreglo" id="operacion-arreglo">
                        <option value="forEach">ForEach - Lista Simple</option>
                        <option value="map">map - Copia solo Nombres</option>
                        <option value="filter">filter - Filtrar Talleres con cupo lleno</option>
                        <option value="find">find - Buscar por el nombre del instructor</option>
                    </select>
                </div>

                <button type="submit">Ejecutar</button>
            </form>

            <output class="resultado" id="resultado-arreglo" for="form-arreglos"></output>
        </section>

        <!-- Sección 2: Manejo de Objetos y JSON -->
        <section class="ejercicio" aria-labelledby="titulo-objeto">
            <h2 id="titulo-objeto">Segunda parte: Manejo de Objetos y JSON</h2>
            <p>Edita el Taller y elige qué operación aplicarle:</p>

            <form class="formulario" id="form-objeto">
                <div class="campo">
                    <label for="obj-nombre">Nombre</label>
                    <input type="text" id="obj-nombre" name="obj-nombre" value="Introducción a Python">
                </div>
                <div class="campo campo-corta">
                    <label for="obj-instructor">Instructor</label>
                    <input type="text" id="obj-instructor" name="obj-instructor" value="Ing. María López">
                </div>
                <div class="campo campo-corta">
                    <label for="obj-cupo">Cupo</label>
                    <input type="number" id="obj-cupo" name="obj-cupo" value="25" min="0">
                </div>
                <div class="campo campo-corta">
                    <label for="obj-inscritos">Inscritos</label>
                    <input type="number" id="obj-inscritos" name="obj-inscritos" value="25" min="0">
                </div>

                <div class="campo">
                    <label for="operacion-objeto">Operación a Realizar</label>
                    <select name="operacion-objeto" id="operacion-objeto">
                        <option value="keys">Object.keys</option>
                        <option value="values">Object.values</option>
                        <option value="entries">Object.entries</option>
                        <option value="stringify">JSON.stringify</option>
                        <option value="roundtrip">Ida y Vuelta de Cadena a JSON</option>
                    </select>
                </div>
                <button type="submit">Ejecutar Opción de Objeto</button>
            </form>

            <output class="resultado" id="resultado-objeto" for="form-objeto"></output>
        </section>
    </main>

    <script src="./js/app.js"></script>
</body>
</html>
